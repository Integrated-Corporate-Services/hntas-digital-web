components:
  schemas:
    ContributorRole:
      enum:
      - DesignatedDesigner
      - DesignatedContractor
      - DesignatedOperator
      type: string
    EnumItemResponse:
      example:
        name: name
        description: description
        value: 0
      properties:
        value:
          format: int32
          type: integer
        name:
          type: string
        description:
          type: string
      type: object
    HeatNetwork:
      example:
        hn_id: hn_id
        name: name
        location: location
        id: id
      properties:
        id:
          nullable: true
          type: string
        hn_id:
          nullable: true
          type: string
        location:
          type: string
        name:
          type: string
      type: object
    InitialUserRegistrationRequest:
      example:
        oneLoginId: oneLoginId
        emailId: emailId
        status: Active
      properties:
        oneLoginId:
          type: string
        emailId:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
      required:
      - emailId
      - oneLoginId
      - status
      type: object
    Invitation:
      example:
        lastName: lastName
        invitedRoles:
        - DesignatedDesigner
        - DesignatedDesigner
        preferredContactType: null
        mobileNumber: mobileNumber
        landlineNumber: landlineNumber
        contactNumberExtension: contactNumberExtension
        invitedHnId: invitedHnId
        invitedEmail: invitedEmail
        firstName: firstName
        permissions:
        - permissions
        - permissions
        rejectedAt: 2000-01-23T04:56:07.000+00:00
        id: id
        invitedAt: 2000-01-23T04:56:07.000+00:00
        acceptedAt: 2000-01-23T04:56:07.000+00:00
        status: Invited
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        preferredContactType:
          $ref: "#/components/schemas/PreferredContactType"
        landlineNumber:
          maxLength: 20
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        contactNumberExtension:
          maxLength: 10
          nullable: true
          pattern: ^\d*$
          type: string
        mobileNumber:
          maxLength: 13
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        permissions:
          items:
            type: string
          nullable: true
          type: array
        invitedRoles:
          items:
            $ref: "#/components/schemas/ContributorRole"
          type: array
        invitedHnId:
          type: string
        invitedEmail:
          type: string
        invitedAt:
          format: date-time
          type: string
        acceptedAt:
          format: date-time
          nullable: true
          type: string
        rejectedAt:
          format: date-time
          nullable: true
          type: string
        status:
          $ref: "#/components/schemas/InvitationStatus"
      required:
      - firstName
      - id
      - invitedAt
      - invitedEmail
      - invitedHnId
      - invitedRoles
      - lastName
      - preferredContactType
      - status
      type: object
    InvitationStatus:
      enum:
      - Invited
      - Accepted
      - Rejected
      type: string
    NullableOfUserStatus:
      enum:
      - Active
      - InActive
      - InvitationSent
      - InvitationAccepted
      - InvitationDeclined
      - null
      nullable: true
      type: string
    Organisation:
      example:
        name: name
        id: id
        companinesHouseNumber: companinesHouseNumber
        type: type
      nullable: true
      properties:
        id:
          type: string
        name:
          type: string
        companinesHouseNumber:
          nullable: true
          type: string
        type:
          type: string
      type: object
    OrganisationType:
      enum:
      - UkCompaniesHouse
      - OtherUkOrganisation
      - OverseasOrganisation
      type: string
    OrgDetails:
      example:
        orgType: UkCompaniesHouse
        firstName: firstName
        lastName: lastName
        orgName: orgName
        preferredContactType: Landline
        mobileNumber: mobileNumber
        jobTitle: jobTitle
        landlineNumber: landlineNumber
        companiesHouseNumber: companiesHouseNumber
        orgId: orgId
        contactNumberExtension: contactNumberExtension
        orgRegisteredAddress:
          country: country
          town: town
          county: county
          postcode: postcode
          addressLine1: addressLine1
          addressLine2: addressLine2
      nullable: true
      properties:
        orgId:
          nullable: true
          type: string
        orgType:
          $ref: "#/components/schemas/OrganisationType"
        companiesHouseNumber:
          nullable: true
          type: string
        orgName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        preferredContactType:
          $ref: "#/components/schemas/PreferredContactType"
        landlineNumber:
          maxLength: 20
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        contactNumberExtension:
          maxLength: 10
          nullable: true
          pattern: ^\d*$
          type: string
        mobileNumber:
          maxLength: 13
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        jobTitle:
          maxLength: 100
          nullable: true
          pattern: "^[a-zA-Z ]+$"
          type: string
        orgRegisteredAddress:
          $ref: "#/components/schemas/OrgRegisteredAddress"
      required:
      - firstName
      - jobTitle
      - lastName
      - orgName
      - orgRegisteredAddress
      - orgType
      - preferredContactType
      type: object
    OrgDetails2:
      example:
        orgType: UkCompaniesHouse
        firstName: firstName
        lastName: lastName
        orgName: orgName
        preferredContactType: Landline
        mobileNumber: mobileNumber
        jobTitle: jobTitle
        landlineNumber: landlineNumber
        companiesHouseNumber: companiesHouseNumber
        orgId: orgId
        contactNumberExtension: contactNumberExtension
        orgRegisteredAddress:
          country: country
          town: town
          county: county
          postcode: postcode
          addressLine1: addressLine1
          addressLine2: addressLine2
      properties:
        orgId:
          nullable: true
          type: string
        orgType:
          $ref: "#/components/schemas/OrganisationType"
        companiesHouseNumber:
          nullable: true
          type: string
        orgName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        preferredContactType:
          $ref: "#/components/schemas/PreferredContactType"
        landlineNumber:
          maxLength: 20
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        contactNumberExtension:
          maxLength: 10
          nullable: true
          pattern: ^\d*$
          type: string
        mobileNumber:
          maxLength: 13
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        jobTitle:
          maxLength: 100
          nullable: true
          pattern: "^[a-zA-Z ]+$"
          type: string
        orgRegisteredAddress:
          $ref: "#/components/schemas/OrgRegisteredAddress"
      required:
      - firstName
      - jobTitle
      - lastName
      - orgName
      - orgRegisteredAddress
      - orgType
      - preferredContactType
      type: object
    OrgRegisteredAddress:
      example:
        country: country
        town: town
        county: county
        postcode: postcode
        addressLine1: addressLine1
        addressLine2: addressLine2
      properties:
        addressLine1:
          type: string
        addressLine2:
          nullable: true
          type: string
        town:
          nullable: true
          type: string
        county:
          nullable: true
          type: string
        postcode:
          type: string
        country:
          nullable: true
          type: string
      required:
      - addressLine1
      - postcode
      type: object
    PreferredContactType:
      enum:
      - Landline
      - Mobile
      type: string
    ProblemDetails:
      example:
        instance: instance
        detail: detail
        type: type
        title: title
        status: 0
      properties:
        type:
          nullable: true
          type: string
        title:
          nullable: true
          type: string
        status:
          format: int32
          nullable: true
          type: integer
        detail:
          nullable: true
          type: string
        instance:
          nullable: true
          type: string
      type: object
    UpdateInvitationRequest:
      example:
        firstName: firstName
        lastName: lastName
        hnId: hnId
        emailAddress: emailAddress
        contributorRoles:
        - DesignatedDesigner
        - DesignatedDesigner
        preferredContactType: Landline
        mobileNumber: mobileNumber
        landlineNumber: landlineNumber
        contactNumberExtension: contactNumberExtension
        status: Invited
      properties:
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        preferredContactType:
          $ref: "#/components/schemas/PreferredContactType"
        landlineNumber:
          maxLength: 20
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        mobileNumber:
          maxLength: 13
          nullable: true
          pattern: "^\\+?\\d{1,3}[\\s-]?\\(?\\d{1,4}\\)?[\\s-]?\\d{1,4}[\\s-]?\\d{1,4}[\\\
            s-]?\\d{1,9}$"
          type: string
        contactNumberExtension:
          maxLength: 10
          nullable: true
          pattern: ^\d*$
          type: string
        hnId:
          type: string
        contributorRoles:
          items:
            $ref: "#/components/schemas/ContributorRole"
          minItems: 1
          type: array
        status:
          $ref: "#/components/schemas/InvitationStatus"
      required:
      - contributorRoles
      - emailAddress
      - firstName
      - hnId
      - lastName
      - preferredContactType
      - status
      type: object
    UpdateOrgDetailsAndRolesRequest:
      example:
        orgDetails:
          orgType: UkCompaniesHouse
          firstName: firstName
          lastName: lastName
          orgName: orgName
          preferredContactType: Landline
          mobileNumber: mobileNumber
          jobTitle: jobTitle
          landlineNumber: landlineNumber
          companiesHouseNumber: companiesHouseNumber
          orgId: orgId
          contactNumberExtension: contactNumberExtension
          orgRegisteredAddress:
            country: country
            town: town
            county: county
            postcode: postcode
            addressLine1: addressLine1
            addressLine2: addressLine2
        role: RegulatoryContact
      properties:
        orgDetails:
          $ref: "#/components/schemas/OrgDetails2"
        role:
          $ref: "#/components/schemas/UserRole"
      required:
      - orgDetails
      - role
      type: object
    User:
      example:
        orgDetails:
          orgType: UkCompaniesHouse
          firstName: firstName
          lastName: lastName
          orgName: orgName
          preferredContactType: Landline
          mobileNumber: mobileNumber
          jobTitle: jobTitle
          landlineNumber: landlineNumber
          companiesHouseNumber: companiesHouseNumber
          orgId: orgId
          contactNumberExtension: contactNumberExtension
